name: Rename landing-index to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename landing-index.html to index.html
        run: |
          git config user.name "jillren"
          git config user.email "jillren@users.noreply.github.com"
          git mv landing-index.html index.html
          git commit -m "Rename landing-index.html to index.html"
          git push
