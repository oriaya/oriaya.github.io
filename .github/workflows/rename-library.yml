name: Rename library file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename library-index.html to index.html
        run: |
          git config user.name "jillren"
          git config user.email "jillren@users.noreply.github.com"
          git mv library/library-index.html library/index.html
          git commit -m "Rename library-index.html to index.html"
          git push
